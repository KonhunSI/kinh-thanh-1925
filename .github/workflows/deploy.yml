name: Đưa web lên GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sinh web
        run: |
          if [ -f CNAME ]; then
            DOMAIN="$(tr -d '[:space:]' < CNAME)"
            export BASE="/" SITE="https://${DOMAIN}" CNAME="${DOMAIN}"
          else
            OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
            REPO="${GITHUB_REPOSITORY#*/}"
            export BASE="/${REPO}/" SITE="https://${OWNER}.github.io/${REPO}"
          fi
          node build.mjs
      - name: Đẩy lên nhánh gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Cập nhật web"
